<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMC Calendar</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <base target="_blank">
</head>
<body>
    <main>
        <h1>AMC Calendar</h1>
        <div id="theatre-lookup">
            <label for="query-input">Search for a theatre by
                <select name="search-by" id="search-by-input" onchange="document.getElementById('query-input').placeholder=`Enter theatre ${document.getElementById('search-by-input').value}`">
                    <option value="city">city</option>
                    <option value="name">name</option>
                </select>:
            </label>
            <input id="query-input" name="query" type="text" placeholder='Enter theatre city' autofocus>
            <button id="theatre-search-button" onclick="lookupTheatres()">Search</button>
            <details id="theatre-lookup-options">
                <summary>Advanced options</summary>
                <div>
                    <label for="theatre-result-count">Number of results:</label>
                    <input id="theatre-result-count" type="number" min="1" value="10" placeholder="e.g. 10">
                </div>
            </details>

            <hr>
            <div id="status-message">--- | N/A</div>
            <br>
            <details class="code-dropdown">
                <summary>Debug Data</summary>
                <hr>
                <pre><code id="theatre-debug-data">No data yet</code></pre>
            </details>
            <section id="theatre-results"></section>
        </div>
        

    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.20.0/axios.min.js" integrity="sha512-OVq+Gfa9PIjbTC0jWOccSFSp/vzkBQ5pMcbHQrNZLl+izmdFmusmAMlX4LT550ivvSnMXMEeG7CxEtjIz6Dn2Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="main.js"></script>
</body>
</html>
