<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMC Calendar</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <base target="_blank">
</head>
<body>
    <main>
        <h1>AMC Calendar</h1>
        <div id="selected-theatre-status">
            <label for="open-theatre-lookup-button" id="selected-theatre-message">Loading theatre...</label>
            <button id="open-theatre-lookup-button" onclick="
                document.getElementById('theatre-lookup').hidden=false;
                document.getElementById('theatre-query-input').focus();
            ">
                Select a Theatre</button>
        </div>

        <section id="theatre-lookup" hidden>
            <button class="close-button" onclick="document.getElementById('theatre-lookup').hidden=true;">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <label for="theatre-query-input">Search for a theatre by
                <select id="search-by-input" onchange="document.getElementById('theatre-query-input').placeholder=`Enter theatre ${document.getElementById('search-by-input').value}`">
                    <option value="city">city</option>
                    <option value="name">name</option>
                </select>:
            </label>
            <input id="theatre-query-input" type="text" placeholder='Enter theatre city'>
            <button id="theatre-search-button" onclick="lookupTheatres()">Search</button>
            <details id="theatre-lookup-options">
                <summary>Advanced options</summary>
                    <label for="theatre-result-count">Number of results:</label>
                    <input id="theatre-result-count" type="number" min="1" value="10" placeholder="e.g. 10">
            </details>
            <hr>
            <section id="theatre-results"></section>
        </section>    
    </main>

    <aside id="infobar" hidden>
        <button class="close-button" onclick="document.getElementById('infobar').hidden=true;">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <header>
            <h2>Info</h2>
            <a href="https://amctheatres.com/" id="amc-link" class="link-chip">AMC</a>
            <a href="https://fandango.com/" id="fandango-link" class="link-chip">Fandango</a>
        </header>
        <section></section>
        
        <template id="theatre-info-template">
            <p><b>Address:</b> <span id="address"></span></p>
            <button id="select-theatre-button">Select This Theatre</button>

        </template>

        <template id="showtime-info-template">

        </template>

    <div id="debug-panel">
        <div id="status-message">--- | N/A</div>
        <details class="code-dropdown">
            <summary>Debug Data</summary>
            <hr>
            <pre><code id="theatre-debug-data">No data yet</code></pre>
        </details>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
